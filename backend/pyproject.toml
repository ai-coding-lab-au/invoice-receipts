[project]
name = "superlight-invoice-backend"
version = "2.2.0"
description = "Superlight Invoice local-first invoice, payment and receipt workflow"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1",
    "uvicorn[standard]>=0.30.0,<1",
    "sqlalchemy>=2.0.30,<3",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "reportlab>=4.0.0,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10", "httpx>=0.27,<1", "pypdf>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["app/static/**", "app/assets/fonts/**"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
