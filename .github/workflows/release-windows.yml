name: Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-desktop.txt

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tagged version
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $pythonVersion = (Select-String -Path backend/pyproject.toml -Pattern '^version\s*=\s*"([^"]+)"$').Matches[0].Groups[1].Value
          $frontendVersion = (Get-Content -Raw frontend/package.json | ConvertFrom-Json).version
          if ($tagVersion -ne $pythonVersion -or $tagVersion -ne $frontendVersion) {
            throw "Tag $tagVersion must match backend ($pythonVersion) and frontend ($frontendVersion) versions."
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install backend, test and desktop dependencies
        run: |
          python -m pip install -e "./backend[dev]"
          python -m pip install -r backend/requirements-desktop.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q --basetemp "${{ runner.temp }}\pytest"

      - name: Build desktop folder
        run: python -m PyInstaller --noconfirm --clean backend/desktop.spec

      - name: Add source and license notices
        shell: pwsh
        run: |
          python scripts/collect_licenses.py --output dist/SuperlightInvoice/licenses
          Copy-Item README.md dist/SuperlightInvoice/README.md
          @(
            "Corresponding source for this build:",
            "${{ github.server_url }}/${{ github.repository }}/tree/${{ github.sha }}",
            "",
            "License: AGPL-3.0-only. See licenses/project/LICENSE.",
            "This software is provided without warranty."
          ) | Set-Content -Encoding UTF8 dist/SuperlightInvoice/SOURCE.txt

      - name: Create installer, portable archive and checksums
        id: package
        shell: pwsh
        run: |
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" -replace '^v', '' } else { "dev-${{ github.run_number }}" }
          $releaseDirectory = Join-Path $PWD "release-artifacts"
          New-Item -ItemType Directory -Path $releaseDirectory | Out-Null

          $installer = & ./scripts/build-windows-installer.ps1 `
            -Version $version `
            -SourceDirectory (Join-Path $PWD "dist\SuperlightInvoice") `
            -OutputDirectory $releaseDirectory
          $installer = [System.IO.Path]::GetFullPath($installer)

          $archiveName = "SuperlightInvoice-$version-windows-x64-portable.zip"
          $archive = Join-Path $releaseDirectory $archiveName
          Compress-Archive -Path dist/SuperlightInvoice -DestinationPath $archive

          @($installer, $archive) | ForEach-Object {
            if ((Get-Item -LiteralPath $_).Length -le 1MB) {
              throw "Release artifact is unexpectedly small: $_"
            }
          }

          $checksums = Join-Path $releaseDirectory "SHA256SUMS.txt"
          @($installer, $archive) | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $_)"
          } | Set-Content -Encoding ASCII $checksums

          "installer=release-artifacts/$(Split-Path -Leaf $installer)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "archive=release-artifacts/$archiveName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksums=release-artifacts/SHA256SUMS.txt" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: SuperlightInvoice-Windows
          path: |
            ${{ steps.package.outputs.installer }}
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.checksums }}
          if-no-files-found: error

      - name: Attest installer
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.installer }}

      - name: Attest portable archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Create or update draft GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --draft --verify-tag --generate-notes --title $tag
          }
          gh release upload $tag `
            "${{ steps.package.outputs.installer }}" `
            "${{ steps.package.outputs.archive }}" `
            "${{ steps.package.outputs.checksums }}" `
            --clobber
